spring.application.name=onboarding-backend
server.port=8090

# --- Base de datos ---
spring.datasource.url=jdbc:postgresql://localhost:5432/onboarding_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# El esquema lo gobierna Flyway; Hibernate solo valida que entidades y tablas coincidan
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# --- Subida de imágenes ---
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=16MB

# --- Tesseract OCR ---
tesseract.datapath=C:\\Program Files\\Tesseract-OCR\\tessdata
# 1 = LSTM only (motor neuronal, el más preciso para documentos)
tesseract.ocrEngineMode=1

# --- Antifraude (módulo authenticity, portado de true-document-backend) ---
app.authenticity.threshold=0.65
app.authenticity.weights.recapture=0.30
app.authenticity.weights.tampering=0.35
app.authenticity.weights.structure=0.35
# El MrzAnalyzer portado usa esta propiedad histórica para su instancia de Tesseract
truedocument.tesseract.data-path=C:/Program Files/Tesseract-OCR/tessdata
# Clasificador ML de foto sobrepuesta (COL_CC_OLD): SVM sobre embeddings MobileNetV2.
# LOO 2026-08-03: 4/5 montajes, 0/57 falsos positivos. Resultado ML => REVIEW, nunca rechazo.
app.authenticity.montage-ml.enabled=true
app.authenticity.montage-model=models/montage-svm-dnn.yml
app.authenticity.montage-features=dnn
app.authenticity.montage-onnx=models/dnn/mobilenetv2-7.onnx

# --- Aplicación ---
app.session.ttl-minutes=30
app.storage.base-dir=captured-documents
app.cors.allowed-origins=http://localhost:5500,http://127.0.0.1:5500

# --- OpenAPI / Swagger ---
springdoc.swagger-ui.path=/swagger-ui.html

# --- Actuator ---
management.endpoints.web.exposure.include=health,info
