spring.application.name=onboarding-backend
server.port=8090

# --- Base de datos ---
spring.datasource.url=jdbc:postgresql://localhost:5432/onboarding_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# El esquema lo gobierna Flyway; Hibernate solo valida que entidades y tablas coincidan
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# --- Subida de imágenes ---
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=16MB

# --- Aplicación ---
app.session.ttl-minutes=30
app.storage.base-dir=captured-documents
app.cors.allowed-origins=http://localhost:5500,http://127.0.0.1:5500

# --- OpenAPI / Swagger ---
springdoc.swagger-ui.path=/swagger-ui.html

# --- Actuator ---
management.endpoints.web.exposure.include=health,info
